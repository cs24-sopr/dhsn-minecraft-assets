name: Release datapack bundle

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  verify-conditions:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check file and release version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEHAVIOUR_MANIFEST="behavior_pack/manifest.json"
          RESOURCE_MANIFEST="resource_pack/manifest.json"

          if [[ ! -f "$BEHAVIOUR_MANIFEST" || ! -f "$RESOURCE_MANIFEST" ]]; then
            echo "One of $BEHAVIOUR_MANIFEST, $RESOURCE_MANIFEST or both are missing. Skipping workflow."
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          LATEST_RELEASE=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // "none"')

          echo "Latest release tag: $LATEST_RELEASE"

          BEHAVIOUR_VERSION=$(jq -er '.header.version | if type == "array" and length == 3 then map(tostring) | join(".") else error("header.version not a version array") end' "$BEHAVIOUR_MANIFEST")
          RESOURCE_VERSION=$(jq -er '.header.version | if type == "array" and length == 3 then map(tostring) | join(".") else error("header.version not a version array") end' "$RESOURCE_MANIFEST")

          echo "Behavior pack version: $BEHAVIOUR_VERSION"
          echo "Resource pack version: $RESOURCE_VERSION"

          SHOULD_RUN=false

          if [[ "$BEHAVIOUR_VERSION" != "$RESOURCE_VERSION" ]]; then
            echo "Pack versions differ; skipping workflow."

          elif [[ "$LATEST_RELEASE" == "none" ]]; then
            echo "No previous release found; continuing."
            SHOULD_RUN=true

          else
            BEHAVIOUR_IS_NEWER=$(python3 scripts/compare_semver.py "$BEHAVIOUR_VERSION" "$LATEST_RELEASE")
            RESOURCE_IS_NEWER=$(python3 scripts/compare_semver.py "$RESOURCE_VERSION" "$LATEST_RELEASE")
            if [[ "$BEHAVIOUR_IS_NEWER" == "true" || "$RESOURCE_IS_NEWER" == "true" ]]; then
              SHOULD_RUN=true
            fi
          fi

          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

  bundle-and-deploy:
    needs: verify-conditions
    if: needs.verify-conditions.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Release new pack versions
        run: |
          echo "would run here"
