name: "Anfrage: Asset"
description: "Hier habt ihr die Möglichkeit ein spezielles Asset anzufragen."
title: "[ASSET]: "
labels: ["asset"]
body:
  - type: markdown
    attributes:
      value: |
        Nutzt dieses Formular, um ein spezielles Asset anzufragen (z. B. einen Block, eine Entity oder ein Item). Bitte achtet dabei auf eine möglichst genaue Beschreibung.

  - type: input
    id: target_name
    attributes:
      label: Was für ein Asset sollen wir für dich umsetzen?
      placeholder: "z. B. Toilette, Waschbecken, Monitor..."
    validations:
      required: true

  - type: textarea
    id: needed_info
    attributes:
      label: (Optional) Falls möglich, beschreibe bitte genau wie du dir das Asset vorstellst z. B. Farben, Länge x Höhe x Tiefe (z. B. zwei Blöcke Breite x 1 Block Höhe...) etc.
      placeholder: "Der Monitor soll einen Standard Windows Bildschirmschoner haben und wie in Raum 103 aussehen."
    validations:
      required: false

  - type: textarea
    id: linked_blocked
    attributes:
      label: (Optional) Ist dieses Ticket an andere Tickets gebunden oder gibt es Abhängigkeiten?
      placeholder: "Es gibt außerdem bereits ein Ticket für einen Schreibtisch. Dieser soll zu dem Monitor passen."
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: Bitte füge ein Foto des Objektes hinzu (In der DHSN aufgenommen). Falls du gerade keins hast, füge es bitte später hinzu!
      placeholder: "Hier z. B. per Drag and Drop ein Foto einfügen..."
    validations:
      required: false